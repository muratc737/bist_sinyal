name: BIST 5 Dk Tarama Botu

on:
  schedule:
    # Hafta içi (1-5), TR saatiyle 10:00 - 18:00 arasına denk gelen UTC 07:00 - 15:00 saatleri arasında, her 5 dakikada bir çalışır.
    - cron: '*/5 7-15 * * 1-5'
  workflow_dispatch: # GitHub üzerinden manuel tetikleyebilmen için buton ekler

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarama Botunu Çalıştır
        run: python scanner.py

      - name: Pozisyon Durumunu (JSON) Kaydet ve Pushla
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add positions.json
          git commit -m "Pozisyon durumu güncellendi" || exit 0
          git push
