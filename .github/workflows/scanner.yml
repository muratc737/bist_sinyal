name: BIST 500 Intraday Bot

on:
  schedule:
    - cron: "*/15 7-15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: bist-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri Yukle
        run: pip install -r requirements.txt

      - name: Botu Calistir
        run: python scanner.py --test

      - name: Pozisyonlari Kaydet ve Pushla
        run: |
          git config user.name "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"
          git add positions.json || true
          git diff --cached --quiet || (git commit -m "otomatik pozisyon durumu" && git push)
