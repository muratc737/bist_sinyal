name: BIST 5 Dk Tarama Botu

on:
  schedule:
    - cron: '*/5 7-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarama Botunu Çalıştır
        run: python scanner.py

      - name: Pozisyon Durumunu (JSON) Kaydet ve Pushla
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          touch positions.json
          git add positions.json || true
          git commit -m "Pozisyon durumu güncellendi" || true
          git push
